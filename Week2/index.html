<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Strawberry Garden</title>

    <!-- Coquette cursive typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #FACEDC;
            color: #2A151C;
            font-family: Georgia, serif;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            color: #2A151C;
            font-size: 58px;
            font-weight: normal;
        }

        h2 {
            font-family: 'Great Vibes', cursive;
            color: #2A151C;
            font-size: 38px;
            font-weight: normal;
        }

        .strawberry-section,
        .flower-section {
            margin: 30px auto;
            padding: 25px;
            max-width: 900px;
            background-color: #FFF9E2;
            border: 5px solid #2F1E14;
            border-radius: 15px;
            box-shadow: 0 5px 10px #2F1E14;
        }

        .image-gallery {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        .wood-frame {
            background-color: #2F1E14;
            border: 7px ridge #2F1E14;
            padding: 8px;
            border-radius: 5px;
            box-shadow: 3px 4px 7px #2F1E14;
        }

        .wood-frame img {
            width: 180px;
            height: 160px;
            object-fit: cover;
            display: block;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Strawberry Garden!</h1>

    <!-- Strawberry section -->
    <section class="strawberry-section">

        <h2 id="strawberry-title">Sweet Strawberries</h2>

        <p id="strawberry-description">
            A little collection of sweet strawberries that make my life better.
        </p>

        <div class="image-gallery">

            <div class="wood-frame">
                <img src="strawberry1.jpg" alt="Pink strawberry">
            </div>

            <div class="wood-frame">
                <img src="strawberry2.jpg" alt="Sweet strawberries">
            </div>

            <div class="wood-frame">
                <img src="strawberry3.jpg" alt="Strawberry illustration">
            </div>

        </div>

    </section>


    <!-- Flower section -->
    <section class="flower-section">

        <h2 id="flower-title">Little Flowers</h2>

        <p id="flower-description">
            Beautiful little white flowers that bloom on strawberry plants.
        </p>

        <div class="image-gallery">

            <div class="wood-frame">
                <img src="flower1.jpg" alt="White flower">
            </div>

            <div class="wood-frame">
                <img src="flower2.jpg" alt="Little daisies">
            </div>

            <div class="wood-frame">
                <img src="flower3.jpg" alt="White and yellow flowers">
            </div>

        </div>

    </section>

    <a href="https://p5js.org">
        Explore p5.js
    </a>

</body>
</html>
